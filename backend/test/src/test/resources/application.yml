spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:alirentest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

aliren:
  jwt:
    secret: aliren-test-secret-key-0123456789abcdef0123456789
    expire-hours: 168
