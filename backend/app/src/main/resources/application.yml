server:
  port: 8080

spring:
  application:
    name: aliren-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/aliren?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:Test!123}
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

aliren:
  jwt:
    # 生产环境务必通过 JWT_SECRET 环境变量覆盖
    secret: ${JWT_SECRET:aliren-dev-secret-key-please-change-in-prod-0123456789}
    expire-hours: 168
  dingtalk:
    app-key: ${DING_APP_KEY:}
    app-secret: ${DING_APP_SECRET:}
    corp-id: ${DING_CORP_ID:}
  llm:
    # 匹配引擎（一句话找房/订阅匹配/求租墙匹配）：配置 LLM_API_KEY 后启用通义千问，
    # 否则走本地简单过滤降级
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:qwen-max}
    timeout-seconds: 10
  upload:
    # 图片上传（MVP 本地静态目录，后续可切 OSS）：目录相对 backend 启动位置
    dir: ${UPLOAD_DIR:./uploads}
    max-size-mb: 5
  robot:
    # 钉钉推送：enabled=true 且提供凭证后启用真实发送（群卡片/工作通知）；
    # 未启用时 PushClientStub 仅记录日志，编排与定时任务照常跑通
    enabled: ${ROBOT_ENABLED:false}
    webhook: ${ROBOT_WEBHOOK:}
  schedule:
    # 定时任务：周五精选周推 / 周一安居故事（缺省开启；真实推送依赖 robot）
    enabled: ${SCHEDULE_ENABLED:true}
    weekly-pick-cron: "0 0 19 * * FRI"
    weekly-story-cron: "0 0 10 * * MON"
