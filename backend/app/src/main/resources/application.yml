server:
  port: 8080

spring:
  application:
    name: aliren-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/aliren?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root}
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

aliren:
  jwt:
    # 生产环境务必通过 JWT_SECRET 环境变量覆盖
    secret: ${JWT_SECRET:aliren-dev-secret-key-please-change-in-prod-0123456789}
    expire-hours: 168
  dingtalk:
    app-key: ${DING_APP_KEY:}
    app-secret: ${DING_APP_SECRET:}
    corp-id: ${DING_CORP_ID:}
  llm:
    # 匹配引擎（一句话找房/订阅匹配/求租墙匹配）：配置 LLM_API_KEY 后启用通义千问，
    # 否则走本地简单过滤降级
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:qwen-max}
    timeout-seconds: 10
